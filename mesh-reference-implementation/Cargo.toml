[workspace]
resolver = "2"
members = [
    "crates/mesh-types",
    "crates/mesh-crypto",
    "crates/mesh-wire",
    "crates/mesh-store",
    "crates/mesh-routing",
    "crates/mesh-core",
    "crates/mesh-bindings",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0 OR MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_cbor = "0.11"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
uniffi = "0.29"
